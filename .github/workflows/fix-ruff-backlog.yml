name: Fix Ruff Backlog

on:
  push:
    branches:
      - fix/full-ruff-backlog

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-ruff-backlog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply manual Ruff repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "scripts/build_study_b_ranking_coverage.py",
              'CONCORDANCE: Final[Path] = ROOT / "data" / "curated" / "dges" / "study_b_parent_university_concordance.csv"',
              'CONCORDANCE: Final[Path] = (\n    ROOT / "data" / "curated" / "dges" / "study_b_parent_university_concordance.csv"\n)',
          )
          replace(
              "scripts/build_study_b_ranking_coverage.py",
              'PROVIDER_STATUS: Final[Path] = ROOT / "data" / "curated" / "rankings" / "study_b_provider_coverage_status.csv"',
              'PROVIDER_STATUS: Final[Path] = (\n    ROOT / "data" / "curated" / "rankings" / "study_b_provider_coverage_status.csv"\n)',
          )
          replace(
              "scripts/build_study_b_regionality.py",
              '            column_totals = [left + right for left, right in zip(column_totals, counts, strict=True)]',
              '            column_totals = [\n                left + right\n                for left, right in zip(column_totals, counts, strict=True)\n            ]',
          )
          replace(
              "scripts/run_study_b_rankings.py",
              '        raise ValueError(f"registered ranking analysis must produce 15 comparison rows, got {len(result)}")',
              '        raise ValueError(\n            "registered ranking analysis must produce 15 comparison rows, "\n            f"got {len(result)}"\n        )',
          )
          replace(
              "scripts/validate_study_b_ranking_values.py",
              '            f"authorised ranking panel not found at {panel_path}; provider values are intentionally not committed"',
              '            f"authorised ranking panel not found at {panel_path}; "\n            "provider values are intentionally not committed"',
          )
          replace(
              "tests/test_study_b_ranking_coverage_audit.py",
              '    frame = pd.read_csv(TIMING, parse_dates=["application_start", "application_deadline", "publication_date"])',
              '    frame = pd.read_csv(\n        TIMING,\n        parse_dates=["application_start", "application_deadline", "publication_date"],\n    )',
          )

          path = Path("scripts/build_study_c_raides_support.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import hashlib\nimport re\n",
              "import hashlib\nimport re\nfrom contextlib import suppress\n",
          )
          text = text.replace(
              "    try:\n        text = str(int(float(text)))\n    except ValueError:\n        pass\n",
              "    with suppress(ValueError):\n        text = str(int(float(text)))\n",
          )
          marker = "\ndef _xlsb_rows(path: Path) -> Iterable[dict[str, Any]]:\n"
          helper = (
              "\ndef _row_value(values: list[Any], index: dict[str, int], name: str) -> Any:\n"
              "    position = index[name]\n"
              "    return values[position] if position < len(values) else None\n"
          )
          if marker not in text:
              raise SystemExit("expected _xlsb_rows marker not found")
          text = text.replace(marker, helper + marker, 1)
          local_get = (
              "\n                def get(name: str) -> Any:\n"
              "                    i = index[name]\n"
              "                    return values[i] if i < len(values) else None\n"
          )
          if local_get not in text:
              raise SystemExit("expected local RAIDES getter not found")
          text = text.replace(local_get, "", 1)
          for label in (
              "Ano letivo",
              "Código do estabelecimento de ensino",
              "Estabelecimento de ensino",
              "Curso/Ciclo de estudos",
              "Área de educação e formação - Código da área geral",
              "Primeira vez",
              "N",
          ):
              text = text.replace(f'get("{label}")', f'_row_value(values, index, "{label}")')
          text = text.replace(
              '    with open_workbook(path) as book:\n        with book.get_sheet("Tabela1") as sheet:\n',
              '    with open_workbook(path) as book, book.get_sheet("Tabela1") as sheet:\n',
          )
          nested = text.split('    with open_workbook(path) as book, book.get_sheet("Tabela1") as sheet:\n', 1)
          if len(nested) != 2:
              raise SystemExit("expected combined XLSB context marker not found")
          prefix, remainder = nested
          end_marker = "\n\ndef _choose_diplomados_sheet"
          if end_marker not in remainder:
              raise SystemExit("expected XLSB reader end marker not found")
          body, suffix = remainder.split(end_marker, 1)
          body = "\n".join(
              line[4:] if line.startswith("        ") else line
              for line in body.split("\n")
          )
          text = prefix + '    with open_workbook(path) as book, book.get_sheet("Tabela1") as sheet:\n' + body + end_marker + suffix
          text = text.replace(
              '                _row_value(values, index, "Área de educação e formação - Código da área geral"), 2\n',
              '                _row_value(\n                    values,\n                    index,\n                    "Área de educação e formação - Código da área geral",\n                ),\n                2,\n',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/pt_he_pipeline/study_a_demography.py")
          text = path.read_text(encoding="utf-8")
          marker = "\ndef validate_population_15_24(\n"
          if marker not in text:
              raise SystemExit("expected demographic validator marker not found")
          text = text.replace(
              marker,
              "\n_DEFAULT_COHORT_PROXY_POLICY = CohortProxyPolicy()\n\n" + marker,
              1,
          )
          text = text.replace(
              "policy: CohortProxyPolicy = CohortProxyPolicy(),",
              "policy: CohortProxyPolicy = _DEFAULT_COHORT_PROXY_POLICY,",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Apply safe Ruff fixes
        shell: bash
        run: poetry run ruff check . --fix || true
      - name: Verify Ruff
        run: poetry run ruff check .
      - name: Verify mypy
        run: poetry run mypy src
      - name: Run tests
        run: poetry run pytest -q
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No Ruff fixes to commit."
            exit 0
          fi
          git commit -m "Fix full-repository Ruff backlog"
          git push origin HEAD:fix/full-ruff-backlog
