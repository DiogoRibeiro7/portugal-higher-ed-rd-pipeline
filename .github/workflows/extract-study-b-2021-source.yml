name: Extract Study B 2021 source

on:
  push:
    branches: [research/study-b-2021-extract-source]
    paths:
      - 'src/pt_he_pipeline/study_b_2021_source.py'
      - 'scripts/extract_study_b_multi_course_2021.py'
      - '.github/workflows/extract-study-b-2021-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Poetry and PDF tools
        run: |
          pip install poetry==2.4.2
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          poetry install --no-interaction
      - name: Download official StatsCurso21
        run: |
          curl --fail --location --retry 3 \
            https://www.dges.gov.pt/guias/pdfs/statcol/2021/StatsCurso21.pdf \
            --output /tmp/StatsCurso21.pdf
          test -s /tmp/StatsCurso21.pdf
          pdftotext -layout /tmp/StatsCurso21.pdf /tmp/StatsCurso21.txt
      - name: Extract candidate rows and coverage gate
        run: |
          poetry run python scripts/extract_study_b_multi_course_2021.py \
            /tmp/StatsCurso21.txt \
            --output-dir /tmp/study-b-2021
      - name: Upload extraction artefacts
        uses: actions/upload-artifact@v6
        with:
          name: study-b-2021-source-extraction
          path: /tmp/study-b-2021/*.csv
          if-no-files-found: error
