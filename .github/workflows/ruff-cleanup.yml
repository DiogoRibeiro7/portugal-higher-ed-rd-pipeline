name: Ruff full-repo cleanup

on:
  push:
    branches:
      - chore/ruff-full-repo-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ruff-full-repo-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Apply safe Ruff fixes
        run: poetry run ruff check . --fix
      - name: Report remaining Ruff findings
        run: poetry run ruff check .
      - name: Commit safe fixes
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No fixes to commit."
            exit 0
          fi
          git commit -m "Fix full-repository Ruff findings"
          git push origin HEAD:chore/ruff-full-repo-cleanup
