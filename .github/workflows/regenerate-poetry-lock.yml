name: Regenerate Poetry Lock

on:
  push:
    branches:
      - chore/ci-reproducibility-lock

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ci-reproducibility-lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Regenerate lock file
        run: poetry lock
      - name: Commit regenerated lock file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          if git diff --cached --quiet; then
            echo "poetry.lock already current."
            exit 0
          fi
          git commit -m "Refresh lock for current dependencies"
          git push origin HEAD:chore/ci-reproducibility-lock
