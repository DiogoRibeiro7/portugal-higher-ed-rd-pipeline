name: Materialise Study A 2025 classification

on:
  push:
    branches: [research/study-a-2025-classification-materialise]
    paths:
      - '.github/workflows/materialise-study-a-2025-classification.yml'
      - 'scripts/build_study_a_2025_cna_universe.py'
      - 'scripts/acquire_dgeec_course_fichas.py'
      - 'scripts/build_study_a_2025_classification_coverage.py'
      - 'src/pt_he_pipeline/dgeec_cnaef.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project
        run: |
          pip install poetry==2.4.2
          poetry install --no-interaction
      - name: Build 2025 CNA universe
        run: |
          poetry run python scripts/build_study_a_2025_cna_universe.py \
            --output-dir /tmp/study-a-2025/dges \
            --raw-dir /tmp/study-a-2025/raw
      - name: Acquire DGEEC classifications
        run: |
          poetry run python scripts/acquire_dgeec_course_fichas.py \
            /tmp/study-a-2025/dges/study_a_2025_cna_course_universe.csv \
            /tmp/study-a-2025/dgeec
      - name: Build classification coverage
        run: |
          poetry run python scripts/build_study_a_2025_classification_coverage.py \
            /tmp/study-a-2025/dges/study_a_2025_cna_pair_universe.csv \
            /tmp/study-a-2025/dges/study_a_2025_cna_course_universe.csv \
            /tmp/study-a-2025/dgeec/dgeec_course_classifications_2013.csv \
            /tmp/study-a-2025/dgeec/dgeec_course_classification_failures_2013.csv \
            --output-dir /tmp/study-a-2025/results
      - name: Upload materialisation artefacts
        uses: actions/upload-artifact@v6
        with:
          name: study-a-2025-classification-materialisation
          path: |
            /tmp/study-a-2025/dges/*.csv
            /tmp/study-a-2025/dgeec/*.csv
            /tmp/study-a-2025/results/*.csv
          if-no-files-found: error
