name: Probe INE age-18 series

on:
  push:
    branches:
      - research/study-a-age18-denominator

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Extract exact age-18 series
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          from urllib.parse import urlencode
          from urllib.request import urlopen

          indicator = "0001223"
          meta_url = (
              "https://www.ine.pt/ine/json_indicador/pindicaMeta.jsp"
              f"?varcd={indicator}&lang=PT"
          )
          with urlopen(meta_url, timeout=60) as response:
              meta = json.load(response)[0]

          age_categories = []
          for item in meta["Dimensoes"]["Categoria_Dim"]:
              for rows in item.values():
                  for row in rows:
                      if row.get("dim_num") == "4" and row.get("categ_dsg") == "18 anos":
                          age_categories.append(row)
          if len(age_categories) != 1:
              raise SystemExit(f"expected one metadata category for age 18, got {age_categories}")
          age_code = age_categories[0]["categ_cod"]

          output = []
          for year in range(2016, 2026):
              params = {
                  "op": 2,
                  "varcd": indicator,
                  "Dim1": f"S7A{year}",
                  "Dim2": "PT",
                  "Dim3": "T",
                  "Dim4": age_code,
                  "lang": "PT",
              }
              url = "https://www.ine.pt/ine/json_indicador/pindica.jsp?" + urlencode(params)
              with urlopen(url, timeout=60) as response:
                  payload = json.load(response)[0]
              rows = payload.get("Dados", {}).get(str(year), [])
              matches = [
                  row
                  for row in rows
                  if row.get("geocod") == "PT"
                  and row.get("dim_3") == "T"
                  and row.get("dim_4") == age_code
                  and row.get("dim_4_t") == "18 anos"
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one Portugal/HM/18 row for {year}, got {len(matches)}"
                  )
              value = int(matches[0]["valor"])
              if value <= 0:
                  raise SystemExit(f"non-positive age-18 population for {year}: {value}")
              output.append((year, value))

          print("indicator=", indicator)
          print("age_code=", age_code)
          print("last_updated=", meta["DataUltimaAtualizacao"])
          print("methodology_note=", meta["Dimensoes"]["Descricao_Dim"][0].get("nota_dsg", ""))
          print("---CSV---")
          buffer = io.StringIO()
          writer = csv.writer(buffer, lineterminator="\n")
          writer.writerow(["population_year", "population_age_18"])
          writer.writerows(output)
          print(buffer.getvalue(), end="")
          PY
