name: Probe INE age-18 series

on:
  push:
    branches:
      - research/study-a-age18-denominator

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Extract Portugal total age-18 values
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          from urllib.request import urlopen

          data_url = (
              "https://www.ine.pt/ine/json_indicador/pindica.jsp"
              "?op=2&varcd=0001223&lang=PT"
          )
          meta_url = (
              "https://www.ine.pt/ine/json_indicador/pindicaMeta.jsp"
              "?varcd=0001223&lang=PT"
          )

          with urlopen(data_url, timeout=60) as response:
              data_payload = json.load(response)[0]
          with urlopen(meta_url, timeout=60) as response:
              meta_payload = json.load(response)[0]

          years = list(range(2016, 2026))
          selected = []
          for year in years:
              rows = [
                  row
                  for row in data_payload["Dados"][str(year)]
                  if row.get("geocod") == "PT"
                  and row.get("dim_3") == "T"
                  and row.get("dim_4_t") == "18 anos"
              ]
              if len(rows) != 1:
                  raise SystemExit(f"expected exactly one Portugal/HM/18 row for {year}, got {len(rows)}")
              row = rows[0]
              value = int(row["valor"])
              if value <= 0:
                  raise SystemExit(f"non-positive age-18 value for {year}: {value}")
              selected.append((year, row["dim_4"], row["dim_4_t"], value))

          age_codes = {item[1] for item in selected}
          if len(age_codes) != 1:
              raise SystemExit(f"age-18 code changed across years: {sorted(age_codes)}")

          print("indicator=", data_payload["IndicadorCod"])
          print("indicator_name=", data_payload["IndicadorDsg"])
          print("last_updated=", data_payload["DataUltimoAtualizacao"])
          print("age_code=", selected[0][1])
          print("metadata_note=", meta_payload.get("Nota", ""))
          print("dimension_note=", meta_payload["Dimensoes"]["Descricao_Dim"][0].get("nota_dsg", ""))
          print("---CSV---")
          buffer = io.StringIO()
          writer = csv.writer(buffer, lineterminator="\n")
          writer.writerow(["population_year", "population_age_18"])
          writer.writerows((year, value) for year, _, _, value in selected)
          print(buffer.getvalue(), end="")
          PY
