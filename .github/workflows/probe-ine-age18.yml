name: Probe INE age-18 series

on:
  push:
    branches:
      - research/study-a-age18-denominator

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare INE endpoint modes
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          for op in (1, 2):
              url = (
                  "https://www.ine.pt/ine/json_indicador/pindica.jsp"
                  f"?op={op}&varcd=0001223&lang=PT"
              )
              with urlopen(url, timeout=60) as response:
                  payload = json.load(response)[0]
              dados = payload.get("Dados", {})
              if isinstance(dados, dict):
                  print(f"op={op} years={sorted(dados.keys())[:5]}...{sorted(dados.keys())[-5:]} count={len(dados)}")
              else:
                  print(f"op={op} Dados type={type(dados).__name__}")
          PY
