name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff changed Python files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="${{ github.sha }}^"
            fi
          fi

          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- '*.py'
          )

          if (( ${#python_files[@]} == 0 )); then
            echo "No changed Python files to lint."
            exit 0
          fi

          printf 'Linting changed Python files:\n%s\n' "${python_files[*]}"
          poetry run ruff check "${python_files[@]}"
      - name: Mypy changed source files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="${{ github.sha }}^"
            fi
          fi

          mapfile -t source_files < <(
            git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- 'src/**/*.py'
          )

          if (( ${#source_files[@]} == 0 )); then
            echo "No changed source Python files to type-check."
            exit 0
          fi

          printf 'Type-checking changed source files:\n%s\n' "${source_files[*]}"
          poetry run mypy "${source_files[@]}"
      - name: Tests
        run: poetry run pytest --cov=pt_he_pipeline --cov-report=term-missing
      - name: Rebuild Study A recent baseline
        run: poetry run python scripts/build_study_a_recent.py
