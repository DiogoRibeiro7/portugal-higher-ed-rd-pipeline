name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Verify lock file
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff full repository
        run: poetry run ruff check .
      - name: Mypy full source tree
        run: poetry run mypy src
      - name: Tests
        run: poetry run pytest --cov=pt_he_pipeline --cov-report=term-missing
      - name: Rebuild Study A recent baseline
        run: poetry run python scripts/build_study_a_recent.py
