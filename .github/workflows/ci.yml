name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.2
      - name: Verify lock file
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff full repository
        run: poetry run ruff check .
      - name: Mypy full source tree
        run: poetry run mypy src
      - name: Tests
        run: poetry run pytest --cov=pt_he_pipeline --cov-report=term-missing
      - name: Rebuild public Study A release layers
        run: |
          poetry run python scripts/build_study_a_recent.py
          poetry run python scripts/build_study_a_medium_run.py
          poetry run python scripts/build_study_a_age18.py
          poetry run python scripts/build_study_a_demographic.py
      - name: Rebuild public Study B release layers
        run: |
          poetry run python scripts/build_study_b_course9119_pilot.py
          poetry run python scripts/build_study_b_multi_course.py
          poetry run python scripts/build_study_b_regionality.py
          poetry run python -m scripts.build_study_b_ranking_coverage
      - name: Verify deterministic public rebuilds
        run: git diff --exit-code
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-english
      - name: Compile manuscript
        run: |
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
