name: Probe Study B 2021 source

on:
  push:
    branches: [research/study-b-2021-extraction]
    paths:
      - '.github/workflows/probe-study-b-2021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download official StatsCurso21
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://www.dges.gov.pt/guias/pdfs/statcol/2021/StatsCurso21.pdf \
            --output /tmp/StatsCurso21.pdf
          test -s /tmp/StatsCurso21.pdf
          pdftotext -layout /tmp/StatsCurso21.pdf /tmp/StatsCurso21.txt
      - name: Reconcile 2020 overlap against committed shards
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          import re

          root = Path('.')
          text = Path('/tmp/StatsCurso21.txt').read_text(encoding='utf-8', errors='replace')
          programmes = {
              '9081': 'Economia',
              '9119': 'Engenharia Informática',
              '9147': 'Gestão',
              '9219': 'Psicologia',
              '9500': 'Enfermagem',
          }
          shards = [
              'course_9081_economics_2018_2020_source_rows.csv',
              'course_9119_engineering_informatics_2018_2020_source_rows.csv',
              'course_9147_management_2018_2020_source_rows_part1.csv',
              'course_9147_management_2018_2020_source_rows_part2a.csv',
              'course_9147_management_2018_2020_source_rows_part2b.csv',
              'course_9219_psychology_2018_2020_source_rows.csv',
              'course_9500_nursing_2018_2020_source_rows_part1.csv',
              'course_9500_nursing_2018_2020_source_rows_part2.csv',
              'course_9500_nursing_2018_2020_source_rows_part3.csv',
              'course_9500_nursing_2018_2020_source_rows_part4.csv',
          ]
          existing: list[dict[str, str]] = []
          for name in shards:
              path = root / 'data/curated/dges' / name
              with path.open(encoding='utf-8', newline='') as handle:
                  existing.extend(csv.DictReader(handle))
          existing = [row for row in existing if row['year'] == '2020']

          measure_columns = [
              'vacancies',
              'applicants',
              'first_choice_applicants',
              'placements',
              'first_choice_placements',
              'last_placed_general_contingent_grade',
              'mean_application_grade_placed',
              'mean_entrance_exam_grade_placed',
              'mean_secondary_grade_placed',
          ]

          heading_pattern = re.compile(
              r'^\s*(?:[A-Z]\d{3}|\d{4})\s+.+?\s+\[Licenciatura\]\s*$',
              re.MULTILINE,
          )

          def section_for(code: str, name: str) -> str:
              marker = re.compile(
                  rf'^\s*{re.escape(code)}\s+{re.escape(name)}\s+\[Licenciatura\]\s*$',
                  re.MULTILINE,
              )
              match = marker.search(text)
              if match is None:
                  raise AssertionError(f'missing heading {code} {name}')
              next_match = heading_pattern.search(text, match.end())
              end = next_match.start() if next_match else len(text)
              return text[match.end():end]

          def parsed_rows(section: str) -> dict[str, tuple[Decimal, ...]]:
              rows: dict[str, tuple[Decimal, ...]] = {}
              for line in section.splitlines():
                  match = re.match(r'^\s*(\d{4})\s+.*?\s+2020\s+(.+)$', line)
                  if match is None:
                      continue
                  institution_code, tail = match.groups()
                  numeric: list[Decimal] = []
                  for token in tail.split():
                      try:
                          numeric.append(Decimal(token))
                      except InvalidOperation:
                          break
                  if len(numeric) < 5:
                      raise AssertionError(
                          f'{institution_code}: expected at least five count measures, got {numeric}'
                      )
                  rows[institution_code] = tuple(numeric)
              return rows

          def expected_measures(row: dict[str, str]) -> tuple[Decimal, ...]:
              values: list[Decimal | None] = []
              for column in measure_columns:
                  raw = row[column].strip()
                  values.append(Decimal(raw) if raw else None)
              while values and values[-1] is None:
                  values.pop()
              if any(value is None for value in values):
                  raise AssertionError(
                      f"{row['programme_code']}/{row['institution_code']}: internal blank in registered measures"
                  )
              return tuple(value for value in values if value is not None)

          total_overlap = 0
          all_failures: list[str] = []
          for code, name in programmes.items():
              source_rows = parsed_rows(section_for(code, name))
              registered = [row for row in existing if row['programme_code'] == code]
              registered_codes = {row['institution_code'] for row in registered}
              parsed_codes = set(source_rows)
              missing = sorted(registered_codes - parsed_codes)
              extras = sorted(parsed_codes - registered_codes)
              mismatches: list[str] = []

              if missing:
                  all_failures.append(
                      f'{code}: registered 2020 institutions missing from StatsCurso21: {missing}'
                  )

              for row in registered:
                  institution_code = row['institution_code']
                  if institution_code not in source_rows:
                      continue
                  expected = expected_measures(row)
                  observed = source_rows[institution_code]
                  if observed[:len(expected)] != expected:
                      mismatches.append(
                          f'{institution_code}: expected={expected}, observed={observed}'
                      )

              if mismatches:
                  all_failures.append(
                      f'{code}: 2020 overlap mismatch: ' + ' | '.join(mismatches)
                  )

              total_overlap += len(registered)
              status = 'ok' if not missing and not mismatches else 'FAIL'
              print(
                  f'{code} {name}: status={status} registered={len(registered)} '
                  f'missing={missing} mismatches={len(mismatches)} '
                  f'extra_nonregistered_2020_rows={extras}'
              )
              for mismatch in mismatches:
                  print(f'  MISMATCH {code}/{mismatch}')

          if all_failures:
              print('\nREGISTERED_2020_OVERLAP_GATE_FAILED')
              for failure in all_failures:
                  print(f'- {failure}')
              raise SystemExit(1)

          print(f'ALL_REGISTERED_2020_OVERLAPS_OK total_rows={total_overlap}')
          PY
