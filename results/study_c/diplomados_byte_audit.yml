schema:
  core_dimensions_present_all_years:
  - Código Estabelecimento
  - Código Curso
  - Curso/Ciclo de Estudos
  - Área de Educação e Formação - Código Área Geral
  - Área de Educação e Formação - Código Área Específica
  - Área de Educação e Formação - Código Área Detalhada
  header_normalisation:
    2018_19_to_2020_21: Código Estabelecimento has a trailing space and is normalised before joins
    2021_22_to_2024_25: Código Estabelecimento without trailing space
  count_regime:
    2018_19_to_2020_21:
      table_type: course-level aggregates
      count_column: Total
    2021_22_to_2024_25:
      table_type: granular demographic rows
      count_column: N
      aggregation_required: sum N after filtering to institution x field x registered cycle component
  field_code_normalisation: normalise general field codes to zero-padded two-digit strings before restricting to 05, 06, 07
  cycle_labels_observed:
  - Curso técnico superior profissional
  - Doutoramento
  - Doutoramento 3.º ciclo
  - Licenciatura 1.º ciclo
  - Licenciatura de mestrado integrado
  - Mestrado 2.º ciclo
  - Mestrado integrado
  - Mestrado integrado terminal
  registered_cycle_mapping:
    graduates_first_cycle:
    - Licenciatura 1.º ciclo
    graduates_second_cycle:
    - Mestrado 2.º ciclo
    - Mestrado integrado
    - Mestrado integrado terminal
    doctoral_graduates:
    - Doutoramento 3.º ciclo
    - Doutoramento
    excluded_from_primary_components:
    - Curso técnico superior profissional
    - Licenciatura de mestrado integrado
    rationale:
      integrated_master_final_awards: Mestrado integrado and Mestrado integrado terminal are treated as second-cycle-equivalent final awards
      integrated_master_licenciatura: Licenciatura de mestrado integrado is excluded to avoid counting an intermediate integrated-master first-cycle award as an independent feeder stage
      legacy_doctorate: Doutoramento is included with third-cycle doctorate because it is a doctoral award and occurs only in the early frozen years
  institution_course_field_cycle_semantics_comparable_full_window: true
