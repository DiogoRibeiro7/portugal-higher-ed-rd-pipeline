version: 2
study: C
artifact: unit_institution_field_weight_gate
status: participation_and_concordance_required

inputs:
  participation_contract: data/source_manifests/study_c_fct_participation.yml
  participation_csv: data/private/fct/study_c_unit_participation.csv
  expected_units_csv: data/private/fct/study_c_primary_units.csv
  expected_units_panel_column: panel_label
  participant_dgeec_concordance_csv: data/private/fct/study_c_participant_dgeec_concordance.csv
  participant_dgeec_concordance_required_columns:
    - participant_institution_id
    - participant_institution_name
    - mapping_status
    - dgeec_institution_code
    - dgeec_institution_name
    - mapping_basis
    - source_reference
  panel_isced_crosswalk_csv: data/curated/fct/study_c_panel_isced_crosswalk.csv

concordance_required_columns:
  - participant_institution_id
  - participant_institution_name
  - mapping_status
  - dgeec_institution_code
  - dgeec_institution_name
  - mapping_basis
  - source_reference

allowed_mapping_statuses:
  - mapped_to_dgeec_establishment
  - not_higher_education_establishment

weight_output:
  tracked_output_csv: results/study_c/unit_institution_field_weights.csv
  required_columns:
    - unit_reference
    - participant_institution_id
    - participant_institution_name
    - concordance_participant_institution_name
    - mapping_status
    - dgeec_institution_code
    - isced_f_scope
    - weight
    - weight_basis
    - source_reference

rules:
  canonical_join_key: participant_institution_id
  participant_names_are_audit_labels_not_join_keys: true
  fuzzy_name_matching_in_production: false
  dgeec_code_required_when_mapping_status_is_mapped: true
  dgeec_name_required_when_mapping_status_is_mapped: true
  blank_dgeec_code_required_when_mapping_status_is_not_higher_education: true
  blank_dgeec_name_required_when_mapping_status_is_not_higher_education: true
  non_higher_education_participants_keep_formal_weight: true
  non_higher_education_participants_are_unavailable_for_raides_linkage: true
  panel_field_source: canonical_fct_panel_crosswalk
  staged_unit_registry_carries_panel_label_not_isced_scope: true
  unit_field_inference_from_unit_name: false
  count_derived_weights_when_complete_counts_exist: true
  equal_share_when_counts_are_entirely_absent_within_unit: true
  mixed_count_availability_within_unit: forbidden
  weights_sum_to_one_per_unit: true
  tolerance: 1.0e-12
  participant_rows_may_not_be_dropped_for_missing_raides_support: true
  unsupported_institution_field_pairs_remain_unavailable_later: true

scientific_boundary:
  this_gate_builds_weights_only: true
  feeder_trends_computed: false
  unit_exposure_computed: false
  weakening_component_count_computed: false
