version: 2
study: C
status: raides_full_window_semantic_schema_validated
window:
  first_academic_year: 2018/2019
  last_academic_year: 2024/2025
source_authority: Direcao-Geral de Estatisticas da Educacao e Ciencia
statistical_system: RAIDES
source_families:
  inscritos:
    purpose:
    - first_time_entrants
    - doctoral_enrolments
    annual_tables_identified_for_full_window: true
    actual_files_validated_full_window: true
    provider_format: xlsb
  diplomados:
    purpose:
    - graduates_first_cycle
    - graduates_second_cycle
    - doctoral_graduates
    annual_tables_identified_for_full_window: true
    actual_files_validated_full_window: true
    provider_format: xlsx
    count_regime_change_2021_22: true
component_contract:
  first_time_entrants:
    definition: students enrolled in the first year for the first time in initial higher-education programmes, using the official DGEEC/RAIDES Primeira vez indicator
    source_family: inscritos
    row_filter:
      Primeira vez: S
    required_dimensions:
    - institution
    - course_or_programme
    - education_training_field
    - academic_year
    status: semantic_and_file_schema_validated
  graduates_first_cycle:
    definition: graduates from standalone first-cycle degree programmes
    source_family: diplomados
    included_cycle_labels:
    - Licenciatura 1.º ciclo
    excluded_integrated_master_intermediate_award: Licenciatura de mestrado integrado
    required_dimensions:
    - institution
    - course_or_programme
    - education_training_field
    - degree_cycle
    - academic_year
    status: semantic_and_file_schema_validated
  graduates_second_cycle:
    definition: graduates receiving second-cycle or integrated-master final awards
    source_family: diplomados
    included_cycle_labels:
    - Mestrado 2.º ciclo
    - Mestrado integrado
    - Mestrado integrado terminal
    excluded_integrated_master_intermediate_award: Licenciatura de mestrado integrado
    required_dimensions:
    - institution
    - course_or_programme
    - education_training_field
    - degree_cycle
    - academic_year
    status: semantic_and_file_schema_validated
  doctoral_enrolments:
    definition: students enrolled in third-cycle/doctoral programmes
    source_family: inscritos
    included_cycle_labels:
    - Doutoramento 3.º ciclo
    required_dimensions:
    - institution
    - course_or_programme
    - education_training_field
    - degree_cycle
    - academic_year
    status: semantic_and_file_schema_validated
  doctoral_graduates:
    definition: graduates awarded a doctoral/third-cycle qualification
    source_family: diplomados
    included_cycle_labels:
    - Doutoramento 3.º ciclo
    - Doutoramento
    legacy_label_note: Doutoramento appears only in the early frozen years and is retained as a doctoral award
    required_dimensions:
    - institution
    - course_or_programme
    - education_training_field
    - degree_cycle
    - academic_year
    status: semantic_and_file_schema_validated
diplomados_count_concordance:
  2018/2019-2020/2021:
    count_column: Total
    row_granularity: institution x course aggregate with demographic subtotals
  2021/2022-2024/2025:
    count_column: N
    row_granularity: granular demographic rows
    aggregation: sum N after component filters
normalisation_rules:
  strip_header_whitespace: true
  institution_identifier: zero-padded four-character DGEEC establishment code after normalisation
  course_identifier: official DGEEC course code
  general_field_code: normalise to zero-padded two-digit string
  primary_field_codes:
  - '05'
  - '06'
  - '07'
aggregation_rules:
  primary_field_level: ISCED-F 2013 two-digit fields 05, 06 and 07
  derive_field_from_official_course_CNAEF_or_equivalent: true
  allocate_national_totals_downwards: false
  allocate_sector_totals_downwards: false
  impute_missing_institution_field_cells: false
  minimum_comparable_annual_observations: 5
remaining_validation_before_analysis_ready:
- compute institution x field x component x year support matrix
- reconcile institution-code concordance across the two RAIDES families
- join eligible FCT units to explicit institution weights
