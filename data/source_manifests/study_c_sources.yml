    official_competition_page: https://www.fct.pt/concursos/programa-plurianual-de-financiamento-de-unidades-de-i-d-2023-2024-1-1
    final_results_published: '2025-07-21'
    final_results_document_url: 'https://myfct.fct.pt/LibDocument/FileDisplay.aspx?EcrypDoctId=ocSoN5+Wv24gEnivBgQPZly5ZHH2zRKsd0JL9oc4KKgvnq8MbZ9hzyJXh8oXN3GzSkHAyTWJfUR16RKrRXKlc3u8nFM9cnq8vrJagDhNBlBrYu8bu+uM0SRxcJ71n0xmkMP8gtECVHEgglBZhSIEEjmsojbKS6nkwIaQCf+NIpU%3D'
    final_results_access: exact_myFCT_document_endpoint_identified
    retrieval_mode: manual_author_supplied_required
