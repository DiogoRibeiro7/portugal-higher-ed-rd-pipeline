version: 1
study: C
artifact: fct_formal_participation_handoff
status: authorised_export_required

scope:
  evaluation_wave: 2023/2024
  canonical_unit_reference_pattern: UID/NNNNN/2023
  primary_scope_isced_f:
    - '05'
    - '06'
    - '07'
  approved_units_total: 313
  primary_scope_units: 120

source_boundary:
  public_sciproj:
    authority: FCT/FCCN
    system: PTCRIS SciPROJ
    portal: https://sciproj.ptcris.pt/
    programme_label: Avaliação UID 2023/2024
    current_funded_activity_records_available: true
    complete_formal_participant_universe_publicly_exposed: false
    management_or_funding_institutions_may_be_visible: true
    may_close_formal_participation_gate: false
  ptcris_research_unit_api:
    authority: FCT/FCCN
    openapi: https://etl.ptcris.pt/openapi-unified.json
    unit_endpoint: /api/v1/unidades/{unit_id}
    unit_persons_endpoint: /api/v1/unidades/{unit_id}/persons
    authentication_required: true
    unauthorised_scraping_or_credential_workaround: forbidden
    authorised_export_accepted: true
  regulatory_definition:
    formal_participating_institution: >-
      Legal entity to which integrated doctoral researchers of the R&D unit are affiliated.
    management_institution_is_not_automatically_participating_institution: true

handoff:
  expected_units_staging_file: data/private/fct/study_c_primary_units.csv
  participation_staging_file: data/private/fct/study_c_unit_participation.csv
  validator: scripts/validate_study_c_fct_participation.py
  required_snapshot_basis: submitted_evaluation_2023_2024_application
  current_membership_substitution_for_application_snapshot: false
  expected_units_required_columns:
    - unit_reference
  participation_required_columns:
    - unit_reference
    - participant_institution_id
    - participant_institution_name
    - source_system
    - source_record_id
    - snapshot_basis
    - integrated_researcher_count
    - source_reference
  row_semantics: one formal participating legal entity per unit
  integrated_researcher_count:
    nullable: true
    if_present: positive_integer
    completeness_rule: all_or_none_within_unit
  source_files_tracked_in_git: false

weight_preparation:
  count_derived_when_complete_positive_counts_exist: true
  equal_share_when_counts_are_unavailable_for_all_participants_in_unit: true
  mixed_count_availability_within_unit: forbidden
  management_only_rows_as_substitute_for_participants: false
  canonical_dgeec_institution_concordance_required_after_handoff: true
  final_unit_institution_field_weights_built_in_this_gate: false

scientific_boundary:
  current_sciproj_management_lists_may_not_be_promoted_to_full_participation: true
  current_2026_membership_may_not_replace_2023_2024_application_membership: true
  no_unit_exposure_computed: true
