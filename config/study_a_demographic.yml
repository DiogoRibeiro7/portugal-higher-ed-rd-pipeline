interpretation:
  - The proxy is a cohort-scale normalisation, not the population aged exactly 18.
  - The population value for year t-1 is aligned to competition year t.
  - Raw placement counts and placement shares remain co-primary outcomes.
  - No missing 2019 STEM broad-area observation is reconstructed.
