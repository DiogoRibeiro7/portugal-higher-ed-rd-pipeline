interpretation:
  - Exact age-18 population is the registered demographic denominator.
  - Competition year t is aligned to population year t-1.
  - Raw placements and national placement share remain distinct co-primary empirical margins.
  - The older 15-24 divided-by-ten denominator is retained only as a broad-cohort sensitivity.
  - No missing 2019 STEM broad-area observation is reconstructed.
